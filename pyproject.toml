[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "h8twin"
version = "0.1.0"
description = "H8 HazardTwin (Galati, Danube): flood detection from multi-temporal Sentinel-1 - data ingestion"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "rasterio", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
